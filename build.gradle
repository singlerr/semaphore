plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.jetbrains.kotlin.plugin.lombok' version '1.9.24'
    id 'io.freefair.lombok' version '8.6'
    id 'org.spongepowered.mixin' version '0.7+'
    id 'com.diffplug.spotless' version '6.25.0'
    id "com.github.johnrengelman.shadow" version '8.1.1'
    id 'org.jetbrains.kotlin.jvm'
}
group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

minecraft {

    mappings channel: mapping_channel, version: mapping_version


    enableIdeaPrepareRuns = true

    copyIdeResources = true

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {

        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'
        }

        client {
            args '--username', 'Dev'


            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven{
        url = "https://repo.essential.gg/repository/maven-public"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    implementation fg.deobf("maven.modrinth:simple-voice-chat:forge-${minecraft_version}-${voicechat_version}")
    shade "gg.essential:elementa-${minecraft_version}-forge:642"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "ForceLoadAsMod": true,
                "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
                "TweakOrder": "0"
        ])
    }

//    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

spotless {
    kotlin {
        target 'src/*/java/**/*.kt','*/src/*/java/**/*.kt'
        ktfmt().dropboxStyle()
        licenseHeader '/* (C) $YEAR singlerr */'
    }
    java{
        target 'src/*/java/**/*.java','*/src/*/java/**/*.java'
        importOrder()

        trimTrailingWhitespace()
        indentWithSpaces()
        indentWithTabs()
        trampoline()
        endWithNewline()
        removeUnusedImports()
        formatAnnotations()

        palantirJavaFormat()

        licenseHeader '/* (C) $YEAR singlerr */'
    }

    groovyGradle {
        target '.gradle', '*/**.gradle'

        greclipse()
    }
}

shadowJar{
    archiveClassifier = null
    configurations = [project.configurations.shade]
    relocate("gg.essential.elementa", "${mod_group_id}.elementa")
    relocate("gg.essential.universalcraft", "${mod_group_id}.universalcraft")

    finalizedBy 'reobfShadowJar', 'addMixinsToJar'
}
assemble.dependsOn shadowJar
reobf{
    shadowJar{

    }
}
kotlin {
    jvmToolchain(8)
}